title: "PortusSophia™ Orientation"
description: "A public, versioned orientation surface for PS-BIOS-001, PortusSophia™ canon, and governance, supporting source-grounded LLM orientation without conferring authority."
url: "https://orientatio.portussophia.com"
baseurl: ""
lang: "en-US"

portussophia:
  template_version: "1.1.0"
  asset_origin: "https://assets.portussophia.com"
  asset_version: "20261004-1"

  header_label: "PortusSophia™ Orientation"
  header_role: "The Declared Interface"

  identity_logo_url: "https://assets.portussophia.com/img/site/logo.png"
  identity_logo_alt: "PortusSophia programme mark"
  identity_title: "PortusSophia™ Orientation"
  identity_declaration: "A public source surface for declared orientation, canon, and governance."

  rights_url: "/RIGHTS.md"

markdown: kramdown
permalink: pretty

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-feed

github:
  is_project_page: false

exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock

# Page presentation metadata lives here so the single BIOS source file below
# remains byte-for-byte identical to the Founder-designated Figshare draft.
defaults:
  - scope:
      path: "structura/PS-BIOS-001.md"
      type: "pages"
    values:
      layout: shoreline-masthead
      permalink: /structura/PS-BIOS-001/
      eyebrow: "PortusStructura™ · Working Orientation"
      intro: "PS-BIOS-001 v1.9-draft r9 (2026-10-03) — Figshare working draft; standing preserved."
      description: "PS-BIOS-001 — The Declared Interface. Working draft v1.9 r9 by James Roy Dennis, PortusSophia, LLC; document-specific CC BY 4.0."

  - scope:
      path: "provenance/PS-PROV-001.md"
      type: "pages"
    values:
      layout: shoreline-masthead
      permalink: /provenance/PS-PROV-001/
      eyebrow: "PortusSophia™ · Provenance · Public working draft"
      intro: "PS-PROV-001 v0.4-draft r7 (2026-10-03) — attributed history, not a source of authority."
      description: "PS-PROV-001 — Provenance, by James Roy Dennis; working-draft status and document-specific CC BY 4.0 preserved."
